name: sursathi
description: "SurSathi - Hindi/Haryanvi/Punjabi music player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---------- State management ----------
  provider: ^6.1.1

  # ---------- Local storage ----------
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.1

  # ---------- Fonts / UI ----------
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # ---------- Audio playback (backend files audio_handler.dart use these) ----------
  # just_audio aur audio_session ko latest minor (0.10.x / 0.2.x) pe NAHI
  # badla — ye pre-1.0 packages hain jahan minor bump breaking hota hai,
  # aur ye is bug (YouTube search/stream fail) ka root cause nahi hain.
  # audio_service sirf patch-bump kiya (safe, no breaking changes).
  just_audio: ^0.9.36
  audio_service: ^0.18.18
  audio_session: ^0.1.18

  # ---------- YouTube backend (youtube_service.dart use karega) ----------
  # NATIVE PLUGIN (2026-09-16, Batch 22 — Option C): pehle yahan
  # `newpipeextractor_dart` (Flutter wrapper package) tha, jo andar se
  # `flutter_inappwebview` (WebView) ke through signature-cipher solve
  # karta tha — usi WebView native View creation ke crash (kuch specific
  # videos pe, native process-level, Dart try/catch se na pakड़ me aane
  # wala) ki wajah se ye dono dependencies hata di gayi hain.
  #
  # Ab NewPipeExtractor (asli NewPipe app wali Java library) ko seedha
  # native Kotlin se call karte hain — dekho android/app/src/main/kotlin/
  # com/sursathi/sursathi/newpipe/ (NewPipeDownloader.kt + NewPipeAudioChannel.kt),
  # MainActivity.kt me MethodChannel "com.sursathi.sursathi/newpipe" se
  # wire kiya gaya hai. Bilkul OuterTune/OpenTune jaisa architecture — koi
  # Flutter-wrapper package beech me nahi, koi WebView nahi (NewPipeExtractor
  # khud signature-cipher Mozilla Rhino, pure JVM JS engine, se solve karta
  # hai — koi Android View nahi banti).
  #
  # NewPipeExtractor dependency ab android/app/build.gradle me seedha hai
  # (com.github.teamnewpipe:NewPipeExtractor), Dart pubspec me nahi — isliye
  # is package list me ab uska naam nahi dikhega, lekin app abhi bhi isi
  # library (aur isi GPL-3.0 license) ko use kar raha hai.
  #
  # *** LICENSE WARNING: NewPipeExtractor khud GPL-3.0 hai. Iska matlab: is
  # app ko bhi GPL-3.0 ke tahat distribute karna zaroori hai (source code
  # publicly available karna padega) agar ye publish/distribute hoti hai.
  # Agar closed-source rakhna hai to ye dependency use nahi kar sakte — is
  # case me neeche wale youtube_explode_dart/Piped layers hi bachte hain
  # (jo kam reliable hain), ya koi non-GPL alternative dhoondhna hoga. ***

  # Backup layers: youtube_explode_dart (seedha YouTube se, dart_ytmusic_api
  # ke saath search ke liye) aur Piped public instances — dono abhi
  # unreliable hain (Sept 2026), isliye ab primary nahi, sirf free extra
  # try hain agar native NewPipeExtractor bhi fail ho jaye.
  http: ^1.2.2
  youtube_explode_dart: ^3.1.0
  dart_ytmusic_api: ^1.3.7

  # ---------- Permissions / device ----------
  permission_handler: ^12.0.0
  device_info_plus: ^10.1.2
  # 5.0.2 ka Android module compileSdk 33 pe compiled hai, jabki naye
  # AndroidX libs (lifecycle, exifinterface, etc) 34+ maangte hain —
  # isi wajah se Gradle build fail hota hai ("currently compiled against
  # android-33" errors). 6.1.5 me compileSdk 34 hai. App mein connectivity_plus
  # actually kahin use nahi ho raha, isliye version bump se koi code
  # change nahi chahiye.
  connectivity_plus: ^6.1.5

  # ---------- Notifications (extra, non-playback notifications) ----------
  flutter_local_notifications: ^17.2.1

  # ---------- Sharing / links ----------
  share_plus: ^10.1.4
  url_launcher: ^6.2.2

  # ---------- Backup/restore (Part 4) — JSON export/import file picker ----------
  # NEW (2026-09-17, Part 4): koi purana file-select mechanism app me nahi
  # tha (share_plus sirf OUTGOING share karta hai, file choose karke
  # WAAPAS Dart me read karne ke liye nahi). Import backup ke liye user ko
  # apne storage se ek .json file chunni hoti hai — file_picker isi kaam
  # ke liye add kiya. UNTESTED (sandbox me build/run nahi ho saka, dekho
  # NOTES.md) — standard/well-maintained package hai, par pehli real CI
  # build ka log dekhna zaroori hai.
  file_picker: ^8.1.3

  # ---------- Misc utils ----------
  intl: ^0.18.1
  uuid: ^4.2.2

  # ---------- Voice search (mic se search karne ke liye) ----------
  speech_to_text: ^7.0.0

  # ---------- PoToken (BotGuard) minting (2026-09-17, "real fix") ----------
  # NewPipe layer ke liye pehle hataayi gayi flutter_inappwebview se ALAG/
  # narrower package — sirf ek chhoti, dedicated, ek-hi-baar-chalne-wali
  # BotGuard mint flow ke liye (per-track signature solving nahi, jahan
  # crash mila tha). Official Flutter-team-maintained package hai, isliye
  # newpipeextractor_dart wale unofficial-wrapper wala crash-risk yahan
  # kam expected hai. Dekho lib/services/potoken_service.dart.
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  # Assets add karne ke liye:
  # 1. assets/images/ aur assets/icons/ folder banao
  # 2. Images daalo
  # 3. Niche wali lines uncomment karo
  # assets:
  #   - assets/images/
  #   - assets/icons/

# App icon generator config — icon file assets/icons/app_icon.png daalna phir
# `flutter pub run flutter_launcher_icons` chalana
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
