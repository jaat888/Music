name: Build SurSathi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          # pubspec.lock ke saath-saath android/*.gradle*, gradle.properties
          # aur gradle-wrapper.properties bhi hash me shaamil kiye — taaki
          # in me se kisi bhi file me change (jaise proguard/repo/version
          # fix) hone par cache key turant badle aur naya/changed dependency
          # fresh download ho, purana stale cache silently reuse na ho.
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock', 'android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Create Android scaffold
        run: flutter create . --platforms=android --org com.sursathi --project-name sursathi --no-overwrite

      - name: Pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk sursathi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sursathi-apk
          path: sursathi.apk
