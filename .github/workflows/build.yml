name: Build SurSathi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # matrix: debug aur release dono jobs ek saath (parallel) chalenge —
      # dono independent runners pe, isliye ek dusre ka wait nahi karte.
      # Public repo pe GitHub-hosted runners free hain, so isse extra
      # paisa nahi lagta — bas thoda zyada free CI minutes use hote hain.
      matrix:
        build-type: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          # pubspec.lock ke saath-saath android/*.gradle*, gradle.properties
          # aur gradle-wrapper.properties bhi hash me shaamil kiye — taaki
          # in me se kisi bhi file me change (jaise proguard/repo/version
          # fix) hone par cache key turant badle aur naya/changed dependency
          # fresh download ho, purana stale cache silently reuse na ho.
          # Debug aur release job ka cache alag rakha (key me build-type
          # shaamil), taaki debug ke unminified deps release ke saath mix
          # na ho.
          key: ${{ runner.os }}-flutter-${{ matrix.build-type }}-${{ hashFiles('**/pubspec.lock', 'android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ matrix.build-type }}-

      - name: Create Android scaffold
        run: flutter create . --platforms=android --org com.sursathi --project-name sursathi --no-overwrite

      - name: Pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK (${{ matrix.build-type }})
        run: flutter build apk --${{ matrix.build-type }} --dart-define=SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }} --dart-define=SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-${{ matrix.build-type }}.apk sursathi-${{ matrix.build-type }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sursathi-apk-${{ matrix.build-type }}
          path: sursathi-${{ matrix.build-type }}.apk
