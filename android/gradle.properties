org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# --- AGP 9 compatibility opt-out (2026-09-16) ---
# flutter_inappwebview_android (all released versions incl. 1.1.3, and even
# 1.2.0-beta.3) still calls getDefaultProguardFile('proguard-android.txt')
# in its own android/build.gradle. AGP 9.0+ hard-fails on this ("no longer
# supported") instead of just warning. This is an OPEN upstream bug —
# https://github.com/pichillilorenzo/flutter_inappwebview/issues/2852 —
# not fixed in any release yet, so a pubspec dependency_override to a newer
# version does NOT help.
#
# This flag tells AGP 9 to allow the old file instead of throwing, exactly
# like other plugin authors (e.g. flutter_gemma PR #514) are doing while
# they wait on upstream. Google has said this opt-out itself goes away in
# AGP 10 (mid-2026), so once flutter_inappwebview_android ships a real fix,
# remove this line and the dependency_overrides block in pubspec.yaml.
android.r8.proguardAndroidTxt.disallowed=false
