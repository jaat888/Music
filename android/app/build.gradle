plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.sursathi.sursathi"
    // compileSdk 36 (2026-09-16 bump): androidx.browser:1.9.0,
    // androidx.core:1.17.0, aur plugins (shared_preferences_android,
    // sqflite_android, url_launcher_android) sab 36 maangte hain — 35 pe
    // pin karne se build FAILED hota hai. Pinned explicitly (na ki sirf
    // flutter.compileSdkVersion pe chhoda) taaki purane Flutter SDK pe bhi
    // sahi value use ho.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications ke liye zaroori — iske bina
        // ":app:checkReleaseAarMetadata" step pe build fail ho jaata hai.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.sursathi.sursathi"
        // flutter_local_notifications 17.x ko minSdk 23+ chahiye
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        // GRADLE FIX (Gradle 9.x): purane template me ye do lines
        // local.properties se manually parse hoti thi, jiske liye
        // file ke top pe `plugins {}` block se PEHLE code likhna padta
        // tha — Gradle 9.x isko allow nahi karta ("no other statements
        // are allowed before plugins {} blocks"). Naye Flutter template
        // ke mutabik `flutter.versionCode`/`flutter.versionName` seedhe
        // Flutter Gradle plugin se milte hain, koi manual parsing nahi
        // chahiye.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            // proguard-android-optimize.txt (na ki purana proguard-android.txt)
            // seedha use kar rahe — AGP 9 ka wahi requirement hai jo
            // gradle.properties me flutter_inappwebview_android ke liye
            // opt-out kiya tha, lekin apni file me shuru se hi sahi likhna
            // behtar hai.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // BUG FIX (2026-09-17): pehle yahan minifyEnabled/shrinkResources
            // kabhi explicitly set nahi kiya gaya tha — koi bhi future build
            // config change (ya CI/Play Store upload pipeline) chup-chaap
            // inhe "true" kar sakta tha, aur tab Android ka resource shrinker
            // res/drawable/ic_notification.xml ko strip kar deta (ye sirf
            // Dart se ek STRING ke through, `Resources.getIdentifier()` se
            // runtime pe dhoonda jaata hai — koi compiled R.drawable.xxx
            // reference nahi hai jo shrinker static analysis me dekh sake),
            // jisse phir "no valid small icon" crash aata (dekho
            // res/raw/keep.xml). Ab dono explicitly false hain, taaki intent
            // saaf rahe — aur res/raw/keep.xml hamesha ke liye safety-net ki
            // tarah maujood hai agar future me kabhi inhe true karna pade.
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // desugar_jdk_libs_NIO (na ki plain desugar_jdk_libs): NewPipeExtractor
    // ke apne docs ke mutabik minSdk 33 se neeche NIO variant chahiye
    // (java.nio.file.* desugaring ke liye) — hamara minSdk 23 hai. Plain
    // desugar_jdk_libs se aage chal ke java.beans.* jaisa hi ek "missing
    // classes" R8 error java.nio.file.* ke liye aa sakta tha. NIO variant
    // plain wale ka superset hai, kuch todta nahi.
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.1.4")

    // NATIVE NewPipeExtractor (2026-09-16, Batch 22 — Option C): pehle ye
    // sirf `newpipeextractor_dart` (Flutter wrapper) ki transitive dependency
    // ki tarah aata tha (isliye pehle se hi JitPack repo + proguard rules
    // upar/is file me maujood hain). Ab wrapper hata diya gaya hai, isliye
    // ise EXPLICITLY yahan declare karna zaroori hai — warna
    // android/app/src/main/kotlin/.../newpipe/*.kt me
    // "org.schabi.newpipe.extractor.*" import compile-time resolve nahi
    // hoga. Version NewPipeExtractor ke GitHub releases (latest v0.26.4,
    // 2026-09-16 ko check kiya) se match ki hai.
    implementation("com.github.teamnewpipe:NewPipeExtractor:v0.26.4")

    // NewPipeDownloader.kt (apna Downloader implementation) OkHttp use
    // karta hai — NewPipeExtractor ke apne quickstart docs me bhi yahi
    // recommend kiya gaya hai. Explicit version pin (transitive pe depend
    // nahi kiya) taaki kabhi bhi koi aur plugin apni okhttp version na
    // todde.
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
}
